name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (server)
        run: cargo clippy --features ssr
      - name: Check (browser)
        run: cargo check --lib --features hydrate --target wasm32-unknown-unknown
      - name: Test
        run: cargo test -p backend -p shared
